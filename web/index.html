<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)">
<title>Desk Radio</title>
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --text: #1d1b18;
    --muted: #6b665e;
    --line: #e2ddd3;
    --accent: #c2410c;
    --accent-text: #ffffff;
    --live: #15803d;
    --wait: #b45309;
    --bad: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161513;
      --card: #211f1c;
      --text: #f1ede6;
      --muted: #a39d93;
      --line: #35322d;
      --accent: #fb923c;
      --accent-text: #1d1b18;
      --live: #4ade80;
      --wait: #fbbf24;
      --bad: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 480px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 1.35rem; margin: 0 0 16px; letter-spacing: -0.01em; }
  .now {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .now-label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .now-station { font-size: 1.25rem; font-weight: 600; margin-top: 2px; overflow-wrap: anywhere; }
  .now-state { display: flex; align-items: center; gap: 8px; margin-top: 6px; color: var(--muted); font-size: 0.95rem; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .playing .dot { background: var(--live); }
  .loading .dot { background: var(--wait); }
  .failed .dot { background: var(--bad); }
  .error { color: var(--bad); font-size: 0.9rem; margin-top: 8px; }
  .controls { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .controls label { color: var(--muted); font-size: 0.9rem; }
  .controls input[type=range] { flex: 1; accent-color: var(--accent); min-height: 32px; }
  .stations { display: grid; gap: 10px; }
  button {
    font: inherit;
    width: 100%;
    min-height: 52px;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    text-align: left;
    cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button.current { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button.stop { margin-top: 16px; text-align: center; font-weight: 600; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Desk Radio</h1>

  <section class="now" id="now" aria-live="polite">
    <div class="now-label">Now</div>
    <div class="now-station" id="now-station">Nothing selected</div>
    <div class="now-state"><span class="dot"></span><span id="now-state">Stopped</span></div>
    <div class="error" id="now-error" hidden></div>
    <div class="controls">
      <label for="volume">Volume</label>
      <input id="volume" type="range" min="0" max="1" step="0.05" value="0.8">
    </div>
  </section>

  <div class="stations" id="stations"></div>
  <button class="stop" id="stop" type="button">Stop</button>
</main>

<audio id="player" preload="none"></audio>

<script>
  const els = {
    now: document.getElementById("now"),
    station: document.getElementById("now-station"),
    state: document.getElementById("now-state"),
    error: document.getElementById("now-error"),
    stations: document.getElementById("stations"),
    stop: document.getElementById("stop"),
    volume: document.getElementById("volume"),
    player: document.getElementById("player"),
  };
  let current = null; // {name, url} of the selected station, or null

  // Per-device conveniences; the page works the same if storage is unavailable.
  const store = {
    get(key) { try { return localStorage.getItem(key); } catch { return null; } },
    set(key, value) { try { localStorage.setItem(key, value); } catch {} },
  };

  function setState(kind, text, error) {
    els.now.className = "now" + (kind ? " " + kind : "");
    els.state.textContent = text;
    els.error.hidden = !error;
    els.error.textContent = error || "";
  }

  function highlight() {
    for (const btn of els.stations.children) {
      const on = !!current && btn.dataset.name === current.name;
      btn.classList.toggle("current", on);
      btn.setAttribute("aria-pressed", on);
    }
  }

  function play(station) {
    current = station;
    els.station.textContent = station.name;
    highlight();
    setState("loading", "Connecting…");
    els.player.src = station.url;
    els.player.play().catch(err => {
      if (err.name !== "AbortError") setState("failed", "Couldn't play", err.message);
    });
    store.set("desk-radio:last", station.name);
    if ("mediaSession" in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: station.name, artist: "Desk Radio" });
    }
  }

  function stop() {
    // Removing the source (not just pausing) stops the live stream from downloading.
    els.player.pause();
    els.player.removeAttribute("src");
    els.player.load();
    current = null;
    highlight();
    setState("", "Stopped");
  }

  els.player.addEventListener("playing", () => setState("playing", "Playing"));
  els.player.addEventListener("waiting", () => current && setState("loading", "Buffering…"));
  // Switching stations fires a transient "pause"; only show Paused if it's still paused after play() runs.
  els.player.addEventListener("pause", () => setTimeout(() => {
    if (current && els.player.paused) setState("", "Paused");
  }, 0));
  els.player.addEventListener("error", () => {
    if (!current) return;
    setState("failed", "Stream unavailable", "This station isn't responding. Try another, or try again later.");
  });

  els.volume.value = store.get("desk-radio:volume") ?? els.volume.value;
  els.player.volume = Number(els.volume.value);
  els.volume.addEventListener("input", () => {
    els.player.volume = Number(els.volume.value);
    store.set("desk-radio:volume", els.volume.value);
  });

  els.stop.addEventListener("click", stop);

  if ("mediaSession" in navigator) {
    navigator.mediaSession.setActionHandler("play", () => current && els.player.play());
    navigator.mediaSession.setActionHandler("pause", () => els.player.pause());
    navigator.mediaSession.setActionHandler("stop", stop);
  }

  async function init() {
    try {
      const res = await fetch("/api/stations");
      if (!res.ok) throw new Error(`Couldn't load stations (${res.status})`);
      const { stations } = await res.json();
      const last = store.get("desk-radio:last");
      for (const station of stations) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.dataset.name = station.name;
        btn.textContent = station.name;
        btn.addEventListener("click", () => play(station));
        els.stations.appendChild(btn);
        if (station.name === last) els.station.textContent = `${station.name} (last played)`;
      }
    } catch (err) {
      setState("failed", "Offline", err.message);
    }
  }

  init();
</script>
</body>
</html>
