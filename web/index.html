<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c0a06">
<meta name="color-scheme" content="dark">
<title>Desk Radio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  /* Amber terminal theme: always dark. */
  :root {
    --bg: #0c0a06;
    --card: #15110a;
    --soft: #1f190e;
    --line: #3b2d14;
    --text: #ffd27a;
    --muted: #b88a3e;
    --accent: #ffb000;
    --accent-text: #0c0a06;
    --live: #ffe08a;
    --wait: #c77d00;
    --bad: #ff6a3d;
    --star: #ffb000;
    --glow: 0 0 8px rgb(255 176 0 / 0.55);
    --pixel: "VT323", ui-monospace, "Cascadia Mono", Consolas, monospace;
    /* pixel map colours */
    --map-sea: #0c0a06;
    --map-land: #6a4b14;
    --map-land-dim: #33260e;
    --map-land-sel: #8a6219;
    --map-border: #0c0a06;
    --map-dot1: #e09a00;
    --map-dot2: #ffc23d;
    --map-dot3: #fff1c4;
    --map-hi: #ffffff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 18px 16px 48px; }
  h1 {
    font: 2.1rem/1 var(--pixel); letter-spacing: 0.04em; margin: 0 0 14px;
    color: var(--accent); text-shadow: var(--glow);
  }
  h1::after { content: "_"; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { h1::after { animation: none; } }

  /* Now playing */
  .now {
    position: sticky; top: 8px; z-index: 2;
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 4px;
    padding: 12px 14px;
    margin-bottom: 16px;
    box-shadow: 0 8px 20px -12px #000;
  }
  .now-top { display: flex; align-items: center; gap: 12px; }
  .now-text { flex: 1; min-width: 0; }
  .now-station { font-size: 1.08rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .now-state { display: flex; align-items: center; gap: 8px; color: var(--muted); font: 1.15rem/1.2 var(--pixel); letter-spacing: 0.03em; }
  .dot { width: 8px; height: 8px; background: var(--muted); flex: none; }
  .playing .dot { background: var(--live); box-shadow: var(--glow); }
  .loading .dot { background: var(--wait); }
  .failed .dot { background: var(--bad); }
  .error { color: var(--bad); font-size: 0.88rem; margin-top: 6px; }
  .controls { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  .controls label { color: var(--muted); font: 1.1rem var(--pixel); }
  .controls input[type=range] { flex: 1; accent-color: var(--accent); min-height: 28px; }

  /* Buttons share a chunky pixel style */
  .stop, .go, .more, .back {
    font: 1.25rem/1 var(--pixel); letter-spacing: 0.04em; text-transform: uppercase;
    min-height: 42px; padding: 0 14px; border-radius: 2px; cursor: pointer;
    border: 2px solid var(--line); background: var(--soft); color: var(--text);
  }
  .stop:hover, .more:hover, .back:hover { border-color: var(--accent); color: var(--accent); }

  /* Tabs */
  .tabs { display: flex; gap: 4px; border: 2px solid var(--line); padding: 3px; border-radius: 4px; margin-bottom: 14px; }
  .tab {
    flex: 1; font: 1.3rem/1 var(--pixel); letter-spacing: 0.05em; text-transform: uppercase;
    min-height: 42px; border: 0; border-radius: 2px; background: transparent; color: var(--muted); cursor: pointer;
  }
  .tab[aria-selected=true] { background: var(--accent); color: var(--accent-text); }

  /* Search */
  .search { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 8px; }
  .search input, .search select {
    font: inherit; min-height: 46px; padding: 0 12px; border-radius: 2px;
    border: 2px solid var(--line); background: var(--card); color: var(--text); min-width: 0;
  }
  .search input::placeholder { color: var(--muted); }
  .search .go { grid-column: 1 / -1; min-height: 46px; border-color: var(--accent); background: var(--accent); color: var(--accent-text); }
  .hint { color: var(--muted); font-size: 0.85rem; margin: 4px 2px 12px; }

  /* Station rows */
  .list { display: grid; gap: 8px; }
  .row {
    display: flex; align-items: center; gap: 4px;
    background: var(--card); border: 2px solid var(--line); border-radius: 4px; overflow: hidden;
  }
  .row.current { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }
  .play {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px;
    font: inherit; text-align: left; padding: 9px 4px 9px 10px; min-height: 58px;
    background: none; border: 0; color: var(--text); cursor: pointer;
  }
  .logo {
    position: relative; width: 40px; height: 40px; border-radius: 2px; flex: none;
    background: var(--soft); display: grid; place-items: center;
    font: 1.5rem var(--pixel); color: var(--muted); overflow: hidden;
  }
  .logo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #fff; opacity: 0; transition: opacity 0.2s; }
  .logo img.ready { opacity: 1; }
  .meta { min-width: 0; }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { color: var(--muted); font-size: 0.83rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .star {
    flex: none; width: 48px; min-height: 58px; font-size: 1.35rem; line-height: 1;
    background: none; border: 0; color: var(--muted); cursor: pointer;
  }
  .star[aria-pressed=true] { color: var(--star); text-shadow: var(--glow); }
  .note { color: var(--muted); text-align: center; padding: 22px 8px; }
  .more { width: 100%; margin-top: 10px; min-height: 46px; }

  /* Pixel map */
  .map-bar { display: flex; align-items: center; gap: 10px; min-height: 42px; margin-bottom: 8px; }
  .map-title { flex: 1; min-width: 0; font: 1.5rem/1.1 var(--pixel); letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); text-shadow: var(--glow); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .screen {
    position: relative; display: grid; place-items: center;
    background: var(--map-sea); border: 2px solid var(--line); border-radius: 4px; overflow: hidden;
    min-height: 160px;
  }
  .screen::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgb(0 0 0 / 0.28) 0 1px, transparent 1px 3px);
  }
  #pixelmap { display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; touch-action: manipulation; }
  .map-status { position: absolute; font: 1.3rem var(--pixel); color: var(--muted); }
  .place-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 10px; margin: 12px 2px 8px; }
  .place-title { font: 1.3rem/1.2 var(--pixel); letter-spacing: 0.03em; text-transform: uppercase; }
  .place-count { color: var(--muted); font-size: 0.85rem; white-space: nowrap; }

  .credit { color: var(--muted); font-size: 0.8rem; text-align: center; margin-top: 22px; }
  .credit a { color: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible, canvas:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>DESK RADIO</h1>

  <section class="now" id="now" aria-live="polite">
    <div class="now-top">
      <div class="now-text">
        <div class="now-station" id="now-station">Nothing playing</div>
        <div class="now-state"><span class="dot"></span><span id="now-state">Pick a station below</span></div>
      </div>
      <button class="stop" id="stop" type="button">Stop</button>
    </div>
    <div class="error" id="now-error" hidden></div>
    <div class="controls">
      <label for="volume">VOL</label>
      <input id="volume" type="range" min="0" max="1" step="0.05" value="0.8">
    </div>
  </section>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-mine" aria-controls="panel-mine" aria-selected="true">Mine</button>
    <button class="tab" role="tab" id="tab-explore" aria-controls="panel-explore" aria-selected="false">Explore</button>
    <button class="tab" role="tab" id="tab-map" aria-controls="panel-map" aria-selected="false">Map</button>
  </div>

  <section id="panel-mine" role="tabpanel" aria-labelledby="tab-mine">
    <div class="list" id="mine"></div>
  </section>

  <section id="panel-explore" role="tabpanel" aria-labelledby="tab-explore" hidden>
    <form class="search" id="search">
      <input id="q" type="search" placeholder="Search stations" aria-label="Search" autocomplete="off" enterkeyhint="search">
      <select id="by" aria-label="Search by">
        <option value="name">Name</option>
        <option value="tag">Genre</option>
        <option value="country">Country</option>
      </select>
      <button class="go" type="submit">Search</button>
    </form>
    <p class="hint" id="hint">Most popular stations worldwide</p>
    <div class="list" id="results"></div>
    <button class="more" id="more" type="button" hidden>Load more</button>
    <p class="credit">Station directory by <a href="https://www.radio-browser.info" target="_blank" rel="noopener">Radio Browser</a></p>
  </section>

  <section id="panel-map" role="tabpanel" aria-labelledby="tab-map" hidden>
    <div class="map-bar">
      <button class="back" id="map-back" type="button" hidden>◀ World</button>
      <div class="map-title" id="map-title">World</div>
    </div>
    <div class="screen" id="screen">
      <canvas id="pixelmap" role="img" aria-label="Pixel map of radio stations. Tap a country, then a station marker."></canvas>
      <div class="map-status" id="map-status">LOADING…</div>
    </div>
    <div class="place-head">
      <span class="place-title" id="place-title"></span>
      <span class="place-count" id="place-count"></span>
    </div>
    <div class="list" id="place"></div>
    <button class="more" id="place-more" type="button" hidden>Show all</button>
    <p class="credit">Stations: <a href="https://www.radio-browser.info" target="_blank" rel="noopener">Radio Browser</a> · Borders: <a href="https://www.naturalearthdata.com" target="_blank" rel="noopener">Natural Earth</a></p>
  </section>
</main>

<audio id="player" preload="none"></audio>

<script>
  const $ = id => document.getElementById(id);
  const els = {
    now: $("now"), station: $("now-station"), state: $("now-state"), error: $("now-error"),
    stop: $("stop"), volume: $("volume"), player: $("player"),
    tabMine: $("tab-mine"), tabExplore: $("tab-explore"), tabMap: $("tab-map"),
    panelMine: $("panel-mine"), panelExplore: $("panel-explore"), panelMap: $("panel-map"),
    mine: $("mine"), results: $("results"), search: $("search"), q: $("q"), by: $("by"), hint: $("hint"), more: $("more"),
    mapBack: $("map-back"), mapTitle: $("map-title"), screen: $("screen"), canvas: $("pixelmap"), mapStatus: $("map-status"),
    placeTitle: $("place-title"), placeCount: $("place-count"), place: $("place"), placeMore: $("place-more"),
  };
  const app = {
    mine: [], results: [], current: null, query: { q: "", by: "name" }, offset: 0, loaded: false,
    list: null, listAll: false, // the station list under the map
  };

  // Per-device conveniences; everything still works if storage is unavailable.
  const store = {
    get(key) { try { return localStorage.getItem(key); } catch { return null; } },
    set(key, value) { try { localStorage.setItem(key, value); } catch {} },
  };

  async function api(path, body) {
    const opts = body === undefined ? {} : {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    };
    const res = await fetch(path, opts);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
    return data;
  }

  // ---- playback ----------------------------------------------------------
  function setState(kind, text, error) {
    els.now.className = "now" + (kind ? " " + kind : "");
    els.state.textContent = text;
    els.error.hidden = !error;
    els.error.textContent = error || "";
  }

  function play(station) {
    app.current = station;
    els.station.textContent = station.name;
    setState("loading", "CONNECTING…");
    els.player.src = station.url;
    els.player.play().catch(err => {
      if (err.name !== "AbortError") setState("failed", "CAN'T PLAY", err.message);
    });
    store.set("desk-radio:last", station.id);
    renderAll();
    if (!station.id.startsWith("local:")) api("/api/click", { id: station.id }).catch(() => {});
    if ("mediaSession" in navigator) {
      const artwork = station.favicon && station.favicon.startsWith("http") ? [{ src: station.favicon }] : [];
      navigator.mediaSession.metadata = new MediaMetadata({ title: station.name, artist: subtitle(station) || "Desk Radio", artwork });
    }
  }

  function stop() {
    // Removing the source (not just pausing) stops the live stream from downloading.
    els.player.pause();
    els.player.removeAttribute("src");
    els.player.load();
    app.current = null;
    els.station.textContent = "Nothing playing";
    setState("", "STOPPED");
    renderAll();
  }

  els.player.addEventListener("playing", () => setState("playing", "ON AIR"));
  els.player.addEventListener("waiting", () => app.current && setState("loading", "BUFFERING…"));
  // Switching stations fires a transient "pause"; only show Paused if it's still paused after play() runs.
  els.player.addEventListener("pause", () => setTimeout(() => {
    if (app.current && els.player.paused) setState("", "PAUSED");
  }, 0));
  els.player.addEventListener("error", () => {
    if (!app.current) return;
    setState("failed", "NO SIGNAL", "This station isn't playing in this browser. Try another, or try again later.");
  });

  els.volume.value = store.get("desk-radio:volume") ?? els.volume.value;
  els.player.volume = Number(els.volume.value);
  els.volume.addEventListener("input", () => {
    els.player.volume = Number(els.volume.value);
    store.set("desk-radio:volume", els.volume.value);
  });
  els.stop.addEventListener("click", stop);
  if ("mediaSession" in navigator) {
    navigator.mediaSession.setActionHandler("play", () => app.current && els.player.play());
    navigator.mediaSession.setActionHandler("pause", () => els.player.pause());
    navigator.mediaSession.setActionHandler("stop", stop);
  }

  // ---- station rows --------------------------------------------------------
  function subtitle(s) {
    const parts = [];
    if (s.country) parts.push(s.country);
    if (s.tags && s.tags.length) parts.push(s.tags.slice(0, 2).join(", "));
    if (s.bitrate) parts.push(`${s.bitrate} kbps`);
    return parts.join(" · ");
  }

  function logo(s) {
    const box = document.createElement("span");
    box.className = "logo";
    box.textContent = (s.name.trim()[0] || "?").toUpperCase();
    // The logo sits on top of the letter; if it fails to load, it's removed and the letter shows.
    if (s.favicon && /^https?:\/\//.test(s.favicon)) {
      const img = document.createElement("img");
      img.alt = "";
      img.loading = "lazy";
      img.referrerPolicy = "no-referrer";
      img.onload = () => img.classList.add("ready");
      img.onerror = () => img.remove();
      img.src = s.favicon;
      box.append(img);
    }
    return box;
  }

  function row(s) {
    const saved = app.mine.some(m => m.id === s.id);
    const isCurrent = !!app.current && app.current.id === s.id;
    const el = document.createElement("div");
    el.className = "row" + (isCurrent ? " current" : "");

    const playBtn = document.createElement("button");
    playBtn.type = "button";
    playBtn.className = "play";
    playBtn.setAttribute("aria-label", `Play ${s.name}`);
    const meta = document.createElement("span");
    meta.className = "meta";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = s.name;
    const sub = document.createElement("div");
    sub.className = "sub";
    sub.textContent = subtitle(s) || " ";
    meta.append(name, sub);
    playBtn.append(logo(s), meta);
    playBtn.addEventListener("click", () => play(s));

    const star = document.createElement("button");
    star.type = "button";
    star.className = "star";
    star.textContent = saved ? "★" : "☆";
    star.setAttribute("aria-pressed", saved);
    star.setAttribute("aria-label", saved ? `Remove ${s.name} from My stations` : `Save ${s.name} to My stations`);
    star.addEventListener("click", () => toggleSaved(s));

    el.append(playBtn, star);
    return el;
  }

  function note(text) {
    const p = document.createElement("p");
    p.className = "note";
    p.textContent = text;
    return p;
  }

  function renderMine() {
    els.mine.replaceChildren(...app.mine.map(row));
    if (!app.mine.length) els.mine.append(note("No saved stations yet. Find some in Explore or on the Map and tap ☆ to save them here."));
  }

  function renderResults() { els.results.replaceChildren(...app.results.map(row)); }

  function renderAll() { renderMine(); renderResults(); renderList(); }

  async function toggleSaved(s) {
    const saved = app.mine.some(m => m.id === s.id);
    try {
      const data = saved ? await api("/api/stations/remove", { id: s.id }) : await api("/api/stations", s);
      app.mine = data.stations;
      renderAll();
    } catch (err) {
      setState("failed", els.state.textContent, `Couldn't update My stations: ${err.message}`);
    }
  }

  // ---- explore -----------------------------------------------------------
  async function search(reset) {
    if (reset) {
      app.offset = 0;
      app.results = [];
      els.results.replaceChildren(note("Searching…"));
      els.more.hidden = true;
    }
    els.more.disabled = true;
    const params = new URLSearchParams({ q: app.query.q, by: app.query.by, offset: app.offset });
    try {
      const data = await api(`/api/search?${params}`);
      const seen = new Set(app.results.map(r => r.id));
      app.results.push(...data.stations.filter(s => !seen.has(s.id)));
      app.offset += 40;
      renderResults();
      if (!app.results.length) els.results.replaceChildren(note("No stations found. Try a different word or search type."));
      els.more.hidden = !data.more;
    } catch (err) {
      if (reset) els.results.replaceChildren(note(err.message));
      else els.more.textContent = "Couldn't load more. Tap to retry.";
    } finally {
      els.more.disabled = false;
    }
  }

  els.search.addEventListener("submit", e => {
    e.preventDefault();
    els.q.blur();
    app.query = { q: els.q.value.trim(), by: els.by.value };
    const label = { name: "name", tag: "genre", country: "country" }[app.query.by];
    els.hint.textContent = app.query.q ? `Stations matching ${label} “${app.query.q}”, most popular first` : "Most popular stations worldwide";
    search(true);
  });
  els.more.addEventListener("click", () => { els.more.textContent = "Load more"; search(false); });

  // ---- station list under the map ------------------------------------------
  const LIST_PREVIEW = 25;

  function showList(title, count, stations) {
    app.list = stations;
    app.listAll = false;
    els.placeTitle.textContent = title;
    els.placeCount.textContent = count;
    renderList();
  }

  function renderList() {
    if (!app.list) { els.place.replaceChildren(); els.placeMore.hidden = true; return; }
    const shown = app.listAll ? app.list : app.list.slice(0, LIST_PREVIEW);
    els.place.replaceChildren(...shown.map(row));
    els.placeMore.hidden = app.listAll || app.list.length <= LIST_PREVIEW;
    els.placeMore.textContent = `Show all ${app.list.length}`;
  }
  els.placeMore.addEventListener("click", () => { app.listAll = true; renderList(); });

  // ---- pixel map -----------------------------------------------------------
  // Countries are drawn by our own scanline rasteriser onto a small canvas, then scaled up
  // with hard pixel edges. Data: country outlines (TopoJSON) + popular stations grouped into places.
  const WORLD = { lon0: -180, lon1: 180, lat0: -56, lat1: 84 };
  const pm = { countries: null, count: 0, places: 0, view: { kind: "world" }, frame: null, selCell: null, loading: null };

  function decodeTopo(topo) {
    const [sx, sy] = topo.transform.scale, [tx, ty] = topo.transform.translate;
    const arcs = topo.arcs.map(arc => {
      let x = 0, y = 0;
      return arc.map(([dx, dy]) => [(x += dx) * sx + tx, (y += dy) * sy + ty]);
    });
    const ring = idxs => {
      let pts = [];
      for (const i of idxs) {
        const a = i >= 0 ? arcs[i] : arcs[~i].slice().reverse();
        for (let k = pts.length ? 1 : 0; k < a.length; k++) pts.push(a[k]);
      }
      // A few outlines (Russia's far east, Fiji, Antarctica) jump from +180 to -180 longitude.
      // Make them continuous (e.g. 170..190) so they fill correctly; views draw rings at +/-360 copies.
      let min = Infinity, max = -Infinity;
      for (const [x] of pts) { if (x < min) min = x; if (x > max) max = x; }
      if (max - min > 180) pts = pts.map(([x, y]) => [x < 0 ? x + 360 : x, y]);
      let lonMin = Infinity, lonMax = -Infinity, latMin = Infinity, latMax = -Infinity;
      for (const [x, y] of pts) {
        if (x < lonMin) lonMin = x; if (x > lonMax) lonMax = x;
        if (y < latMin) latMin = y; if (y > latMax) latMax = y;
      }
      Object.assign(pts, { lonMin, lonMax, latMin, latMax });
      return pts;
    };
    return topo.objects.countries.geometries.map(g => {
      const polys = (g.type === "Polygon" ? [g.arcs] : g.type === "MultiPolygon" ? g.arcs : []).map(p => p.map(ring));
      const rings = polys.flat();
      // Rough box in plain -180..180 longitude, used only to skip obviously distant countries.
      const bbox = [Infinity, Infinity, -Infinity, -Infinity];
      for (const r of rings) {
        const wraps = r.lonMax > 180;
        bbox[0] = Math.min(bbox[0], wraps ? -180 : r.lonMin); bbox[2] = Math.max(bbox[2], wraps ? 180 : r.lonMax);
        bbox[1] = Math.min(bbox[1], r.latMin); bbox[3] = Math.max(bbox[3], r.latMax);
      }
      return { name: g.properties.name, polys, rings, bbox, places: [], stations: 0 };
    });
  }

  function pointIn(rings, x, y) {
    let inside = false;
    for (const r of rings) {
      const px = r.lonMax > 180 && x < 0 ? x + 360 : x; // match the ring's continuous longitudes
      for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
        const [xi, yi] = r[i], [xj, yj] = r[j];
        if ((yi > y) !== (yj > y) && px < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
      }
    }
    return inside;
  }

  // The copy of a longitude (lon, lon +/- 360) closest to a reference longitude.
  const nearestLon = (lon, ref) => lon + 360 * Math.round((ref - lon) / 360);

  const simple = s => (s || "").toLowerCase().replace(/^the /, "").replace(/[^a-z]/g, "");
  const sameName = (a, b) => { a = simple(a); b = simple(b); return !!a && !!b && (a.includes(b) || b.includes(a)); };

  const OFFSHORE = 1.5; // degrees: how far off a coastline a station can be and still count for that country

  function assignPlaces(places) {
    for (const p of places) {
      let hit = -1, named = -1, near = -1, nearD = Infinity;
      const listed = p.stations[0] && p.stations[0].country;
      pm.countries.forEach((c, i) => {
        if (hit >= 0) return;
        const b = c.bbox, slack = OFFSHORE + 0.5;
        if (p.lat < b[1] - slack || p.lat > b[3] + slack) return;
        if (b[2] - b[0] < 359 && (p.lon < b[0] - slack || p.lon > b[2] + slack)) return;
        if (pointIn(c.rings, p.lon, p.lat)) { hit = i; return; }
        // Not inside any outline (just offshore, or tiny islands missing from the data): measure the
        // distance to each of this country's shapes, and prefer the country the station says it's in.
        for (const r of c.rings) {
          const lon = nearestLon(p.lon, (r.lonMin + r.lonMax) / 2);
          const dx = Math.max(r.lonMin - lon, 0, lon - r.lonMax), dy = Math.max(r.latMin - p.lat, 0, p.lat - r.latMax);
          const d = dx * dx + dy * dy;
          if (d < nearD) { nearD = d; near = i; }
          if (d <= OFFSHORE * OFFSHORE && named < 0 && sameName(c.name, listed)) named = i;
        }
      });
      p.country = hit >= 0 ? hit : named >= 0 ? named : nearD <= OFFSHORE * OFFSHORE ? near : -1;
      if (p.country >= 0) {
        const c = pm.countries[p.country];
        c.places.push(p);
        c.stations += p.stations.length;
      }
    }
  }

  async function loadMap() {
    const [topo, data] = await Promise.all([api("/countries-50m.json"), api("/api/map")]);
    pm.countries = decodeTopo(topo);
    assignPlaces(data.places);
    pm.allPlaces = data.places; // the world view shows every place, including ones outside any country
    pm.count = data.count;
    pm.places = data.places.length;
  }

  // Bounds for a country view. Countries with far-flung territories (France, USA, Netherlands...)
  // would shrink to a speck if we fitted everything, so the view centres on the main landmass:
  // the polygon holding the most stations (or the largest, if none). Islands and stations within
  // a margin around it are included; distant territories stay out of the view but in the list.
  function countryBounds(c) {
    let main = null, mainScore = -1;
    for (const poly of c.polys) {
      const outer = poly[0];
      let stations = 0;
      for (const p of c.places) if (pointIn(poly, p.lon, p.lat)) stations += p.stations.length;
      let area = 0;
      for (let i = 0, j = outer.length - 1; i < outer.length; j = i++) area += (outer[j][0] + outer[i][0]) * (outer[j][1] - outer[i][1]);
      const score = stations * 1e6 + Math.abs(area); // stations first, area breaks ties
      if (score > mainScore) { mainScore = score; main = poly; }
    }
    if (!main) return WORLD;
    const r0 = main[0];
    const b = [r0.lonMin, r0.latMin, r0.lonMax, r0.latMax];
    const ref = (b[0] + b[2]) / 2; // everything else is placed on the main landmass's side of the date line
    // Margin around the main landmass: half its size, at least 3 degrees.
    const mx = Math.max((b[2] - b[0]) * 0.5, 3), my = Math.max((b[3] - b[1]) * 0.5, 3);
    const near = [b[0] - mx, b[1] - my, b[2] + mx, b[3] + my];
    const inNear = (lon, lat) => lon >= near[0] && lon <= near[2] && lat >= near[1] && lat <= near[3];
    const grow = (lon0, lat0, lon1, lat1) => {
      b[0] = Math.min(b[0], lon0); b[1] = Math.min(b[1], lat0); b[2] = Math.max(b[2], lon1); b[3] = Math.max(b[3], lat1);
    };
    for (const poly of c.polys) { // nearby islands, e.g. Corsica
      const r = poly[0];
      const off = nearestLon((r.lonMin + r.lonMax) / 2, ref) - (r.lonMin + r.lonMax) / 2;
      if (inNear(r.lonMin + off, r.latMin) && inNear(r.lonMax + off, r.latMax)) grow(r.lonMin + off, r.latMin, r.lonMax + off, r.latMax);
    }
    for (const p of c.places) {
      const lon = nearestLon(p.lon, ref);
      if (inNear(lon, p.lat)) grow(lon, p.lat, lon, p.lat);
    }
    const padLon = Math.max((b[2] - b[0]) * 0.08, 0.6), padLat = Math.max((b[3] - b[1]) * 0.08, 0.4);
    return { lon0: b[0] - padLon, lon1: b[2] + padLon, lat0: Math.max(b[1] - padLat, -89), lat1: Math.min(b[3] + padLat, 89) };
  }

  function fillRings(rings, W, H, grid, id) {
    const rows = new Map();
    for (const ring of rings) {
      let [px, py] = ring[ring.length - 1];
      for (const [x, y] of ring) {
        if (y !== py) {
          const ya = Math.min(y, py), yb = Math.max(y, py);
          const r0 = Math.max(0, Math.ceil(ya - 0.5)), r1 = Math.min(H - 1, Math.ceil(yb - 0.5) - 1);
          for (let r = r0; r <= r1; r++) {
            const xi = px + (r + 0.5 - py) * (x - px) / (y - py);
            let xs = rows.get(r);
            if (!xs) rows.set(r, xs = []);
            xs.push(xi);
          }
        }
        px = x; py = y;
      }
    }
    let painted = 0;
    for (const [r, xs] of rows) {
      xs.sort((a, b) => a - b);
      for (let i = 0; i + 1 < xs.length; i += 2) { // even-odd rule handles lakes and holes
        const c0 = Math.max(0, Math.ceil(xs[i] - 0.5)), c1 = Math.min(W - 1, Math.ceil(xs[i + 1] - 0.5) - 1);
        for (let c = c0; c <= c1; c++) { grid[r * W + c] = id; painted++; }
      }
    }
    return painted;
  }

  function rgb(name) {
    const hex = getComputedStyle(document.documentElement).getPropertyValue(name).trim().replace("#", "");
    return [0, 2, 4].map(i => parseInt(hex.slice(i, i + 2), 16));
  }

  function renderMap() {
    if (!pm.countries || els.panelMap.hidden) return;
    const v = pm.view;
    const sel = v.kind === "country" ? v.idx : -1;
    const b = sel >= 0 ? countryBounds(pm.countries[sel]) : WORLD;

    // Choose a pixel size so the map is ~170-260 "pixels" across, each drawn as a P x P square.
    const cssW = els.screen.clientWidth - 4;
    const P = Math.max(2, Math.round(cssW / 210));
    const maxW = Math.floor(cssW / P);
    const maxH = Math.floor(Math.min(window.innerHeight * 0.58, 520) / P);
    const kx = sel >= 0 ? Math.cos(((b.lat0 + b.lat1) / 2) * Math.PI / 180) : 1;
    const s = Math.min(maxW / ((b.lon1 - b.lon0) * kx), maxH / (b.lat1 - b.lat0));
    const W = Math.max(1, Math.round((b.lon1 - b.lon0) * kx * s)), H = Math.max(1, Math.round((b.lat1 - b.lat0) * s));
    const T = (lon, lat) => [(lon - b.lon0) * kx * s, (b.lat1 - lat) * s];
    const mid = (b.lon0 + b.lon1) / 2;
    const ptLon = lon => nearestLon(lon, mid); // put points on this view's side of the date line

    // Each ring is drawn at whichever of its copies (lon - 360, lon, lon + 360) overlap the view,
    // so shapes crossing the date line appear on both edges of the world map and whole in country views.
    const visibleRings = c => {
      const out = [];
      for (const r of c.rings) {
        if (r.latMax < b.lat0 || r.latMin > b.lat1) continue;
        for (const off of [-360, 0, 360]) {
          if (r.lonMax + off < b.lon0 || r.lonMin + off > b.lon1) continue;
          out.push(r.map(([lon, lat]) => T(lon + off, lat)));
        }
      }
      return out;
    };

    const grid = new Int16Array(W * H).fill(-1);
    const tiny = [];
    pm.countries.forEach((c, i) => {
      if (!fillRings(visibleRings(c), W, H, grid, i)) tiny.push(i);
    });
    // Countries too small for even one pixel get one, so they can be seen and tapped. Those with
    // stations claim a pixel even inside a bigger neighbour (Switzerland, Israel at world scale),
    // most stations first; if their best pixel is already claimed, they take the nearest free one.
    const claimed = new Set();
    const owned = new Map(); // pixels per country, so we only take pixels from countries that can spare them
    for (const g of grid) if (g >= 0) owned.set(g, (owned.get(g) || 0) + 1);
    const canTake = (k, i) => grid[k] < 0 || (grid[k] !== i && (owned.get(grid[k]) || 0) >= 4);
    tiny.sort((a, b) => pm.countries[b].stations - pm.countries[a].stations);
    for (const i of tiny) {
      const c = pm.countries[i];
      let r = null; // centre on its largest shape
      for (const poly of c.polys) if (!r || (poly[0].lonMax - poly[0].lonMin) * (poly[0].latMax - poly[0].latMin) > (r.lonMax - r.lonMin) * (r.latMax - r.latMin)) r = poly[0];
      if (!r) continue;
      const [cx, cy] = T(ptLon((r.lonMin + r.lonMax) / 2), (r.latMin + r.latMax) / 2).map(Math.floor);
      let spot = -1;
      for (let rad = 0; rad <= 2 && spot < 0; rad++) {
        for (let dy = -rad; dy <= rad && spot < 0; dy++) for (let dx = -rad; dx <= rad && spot < 0; dx++) {
          const x = cx + dx, y = cy + dy, k = y * W + x;
          if (x < 0 || y < 0 || x >= W || y >= H || claimed.has(k)) continue;
          if (c.stations > 0 ? canTake(k, i) : grid[k] < 0) spot = k; // stationless ones only take empty sea
        }
      }
      if (spot >= 0) {
        if (grid[spot] >= 0) owned.set(grid[spot], owned.get(grid[spot]) - 1);
        grid[spot] = i;
        claimed.add(spot);
      }
    }

    const col = {
      sea: rgb("--map-sea"), land: rgb("--map-land"), dim: rgb("--map-land-dim"), selLand: rgb("--map-land-sel"),
      border: rgb("--map-border"), d1: rgb("--map-dot1"), d2: rgb("--map-dot2"), d3: rgb("--map-dot3"), hi: rgb("--map-hi"),
    };
    const img = new ImageData(W, H);
    const put = (x, y, c) => {
      if (x < 0 || y < 0 || x >= W || y >= H) return;
      const o = (y * W + x) * 4;
      img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = 255;
    };
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const id = grid[y * W + x];
        let c = col.sea;
        if (id >= 0) {
          c = sel < 0 ? col.land : id === sel ? col.selLand : col.dim;
          // A pixel on the edge between two countries becomes border, so each country reads as a tile.
          const right = x + 1 < W ? grid[y * W + x + 1] : id, down = y + 1 < H ? grid[(y + 1) * W + x] : id;
          if ((right >= 0 && right !== id) || (down >= 0 && down !== id)) c = col.border;
        }
        put(x, y, c);
      }
    }

    // Station markers: one per pixel cell, brighter where more stations share it.
    const cells = new Map();
    const placesShown = sel >= 0 ? pm.countries[sel].places : pm.allPlaces;
    for (const p of placesShown) {
      const [fx, fy] = T(ptLon(p.lon), p.lat);
      const x = Math.floor(fx), y = Math.floor(fy);
      if (x < 0 || y < 0 || x >= W || y >= H) continue;
      const key = y * W + x;
      let cell = cells.get(key);
      if (!cell) cells.set(key, cell = { key, x, y, stations: [] });
      cell.stations.push(...p.stations);
    }
    const tier = n => (n >= 10 ? col.d3 : n >= 3 ? col.d2 : col.d1);
    for (const cell of cells.values()) {
      const c = tier(cell.stations.length);
      if (sel >= 0) { // a small "+" marker in country view
        put(cell.x - 1, cell.y, col.d1); put(cell.x + 1, cell.y, col.d1);
        put(cell.x, cell.y - 1, col.d1); put(cell.x, cell.y + 1, col.d1);
      }
      put(cell.x, cell.y, c);
    }
    const chosen = pm.selCell != null && cells.get(pm.selCell);
    if (chosen) { // selected marker: a bright 3x3 block
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) put(chosen.x + dx, chosen.y + dy, col.hi);
    }

    const canvas = els.canvas;
    canvas.width = W; canvas.height = H;
    canvas.style.width = `${W * P}px`; canvas.style.height = `${H * P}px`;
    canvas.getContext("2d").putImageData(img, 0, 0);
    pm.frame = { W, H, P, grid, cells, sel };
  }

  function toCell(e) {
    const r = els.canvas.getBoundingClientRect();
    const f = pm.frame;
    return [Math.floor((e.clientX - r.left) / r.width * f.W), Math.floor((e.clientY - r.top) / r.height * f.H)];
  }

  function countryAt(x, y, radius) {
    const f = pm.frame;
    let best = -1, bestD = Infinity;
    for (let dy = -radius; dy <= radius; dy++) for (let dx = -radius; dx <= radius; dx++) {
      const cx = x + dx, cy = y + dy;
      if (cx < 0 || cy < 0 || cx >= f.W || cy >= f.H) continue;
      const id = f.grid[cy * f.W + cx], d = dx * dx + dy * dy;
      if (id >= 0 && d < bestD) { best = id; bestD = d; }
    }
    return best;
  }

  function cellNear(x, y, radius) {
    let best = null, bestD = radius * radius + 1;
    for (const cell of pm.frame.cells.values()) {
      const d = (cell.x - x) ** 2 + (cell.y - y) ** 2;
      if (d < bestD) { best = cell; bestD = d; }
    }
    return best;
  }

  const byRank = list => list.slice().sort((a, b) => (a.rank ?? 1e9) - (b.rank ?? 1e9));
  const plural = (n, word) => `${n.toLocaleString()} ${word}${n === 1 ? "" : "s"}`;

  function showWorld() {
    pm.view = { kind: "world" };
    pm.selCell = null;
    els.mapBack.hidden = true;
    els.mapTitle.textContent = "World";
    showList("Tap a country to zoom in", `${plural(pm.count, "station")} · ${plural(pm.places, "place")}`, null);
    renderMap();
  }

  function showCountry(idx) {
    const c = pm.countries[idx];
    pm.view = { kind: "country", idx };
    pm.selCell = null;
    els.mapBack.hidden = false;
    els.mapTitle.textContent = c.name;
    const stations = byRank(c.places.flatMap(p => p.stations));
    showList(stations.length ? "Top stations · tap a + for one spot" : "No located stations here yet",
             stations.length ? plural(stations.length, "station") : "", stations);
    renderMap();
  }

  function showCell(cell) {
    pm.selCell = cell.key;
    const n = cell.stations.length;
    showList("Stations at this spot", plural(n, "station"), byRank(cell.stations));
    renderMap();
    els.placeTitle.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  els.canvas.addEventListener("click", e => {
    if (!pm.frame) return;
    const [x, y] = toCell(e);
    if (pm.view.kind === "world") {
      const id = countryAt(x, y, 2);
      if (id >= 0) showCountry(id);
      return;
    }
    const cell = cellNear(x, y, Math.max(3, Math.round(16 / pm.frame.P))); // ~16 css px finger tolerance
    if (cell) { showCell(cell); return; }
    const other = countryAt(x, y, 0);
    if (other >= 0 && other !== pm.view.idx && pm.countries[other].stations > 0) showCountry(other); // hop to a neighbour
    else if (pm.selCell != null) showCountry(pm.view.idx); // tap empty land: back to the whole country
  });
  els.canvas.addEventListener("pointermove", e => {
    if (!pm.frame || pm.view.kind !== "world" || e.pointerType !== "mouse") return;
    const [x, y] = toCell(e);
    const id = countryAt(x, y, 1);
    els.mapTitle.textContent = id >= 0 ? pm.countries[id].name : "World";
  });
  els.canvas.addEventListener("pointerleave", () => { if (pm.view.kind === "world") els.mapTitle.textContent = "World"; });
  els.mapBack.addEventListener("click", showWorld);

  let resizeTimer = 0;
  window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(renderMap, 150); });

  async function openMap() {
    if (pm.countries) { renderMap(); return; }
    if (pm.loading) return;
    els.mapStatus.hidden = false;
    els.mapStatus.textContent = "LOADING…";
    pm.loading = loadMap();
    try {
      await pm.loading;
      els.mapStatus.hidden = true;
      showWorld();
    } catch (err) {
      pm.countries = null;
      els.mapStatus.textContent = "NO SIGNAL";
      showList(err.message, "", null);
    } finally {
      pm.loading = null;
    }
  }

  // ---- tabs --------------------------------------------------------------
  const tabs = {
    mine: [els.tabMine, els.panelMine],
    explore: [els.tabExplore, els.panelExplore],
    map: [els.tabMap, els.panelMap],
  };
  function showTab(which) {
    for (const [name, [tab, panel]] of Object.entries(tabs)) {
      tab.setAttribute("aria-selected", name === which);
      panel.hidden = name !== which;
    }
    store.set("desk-radio:tab", which);
    if (which === "explore" && !app.loaded) { app.loaded = true; search(true); }
    if (which === "map") openMap();
  }
  for (const [name, [tab]] of Object.entries(tabs)) tab.addEventListener("click", () => showTab(name));

  // ---- start -------------------------------------------------------------
  async function init() {
    try {
      app.mine = (await api("/api/stations")).stations;
      const last = app.mine.find(s => s.id === store.get("desk-radio:last"));
      if (last) els.station.textContent = `${last.name} (last played)`;
    } catch (err) {
      setState("failed", "OFFLINE", err.message);
    }
    renderMine();
    const savedTab = store.get("desk-radio:tab");
    showTab(savedTab in tabs ? savedTab : "mine");
  }
  init();
</script>
</body>
</html>
