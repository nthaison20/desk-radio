# Silent stand-in radio for development on the XU4 (Phase A).
# Accepts the same commands as the real radio, but outputs no sound.
music_directory    "~/desk-radio/.mpd-dev/music"
playlist_directory "~/desk-radio/.mpd-dev/playlists"
db_file            "~/desk-radio/.mpd-dev/database"
state_file         "~/desk-radio/.mpd-dev/state"
pid_file           "~/desk-radio/.mpd-dev/pid"
log_file           "~/desk-radio/.mpd-dev/log"
bind_to_address    "127.0.0.1"
port               "6600"

audio_output {
    type "null"
    name "silent stand-in"
}
